[package]
name = "birdscounter"
version = "0.9.2"
description = "Birds counting app"
authors = ["Łukasz Bednarski"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "birdscounter_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2.6.0"
tauri-plugin-fs = "2.4.5"
opencv = { version = "0.101", features = ["clang-runtime", "geometry", "imgcodecs", "imgproc"] }

[target.'cfg(target_os = "ios")'.dependencies]
# Calls the app's Objective-C bridge (camera, photo library, quick actions); see src/native.rs.
objc2 = "0.6"


# swift-rs 1.0.9 (same code as 1.0.8) with a fix for Xcode 27 iOS builds: it leaves the SwiftRs runtime
# symbols internal, so linking fails with "_retain_object" undefined. Drop this once
# an upstream release exports them.
[patch.crates-io]
swift-rs = { path = "vendor/swift-rs" }
