# Android target-specific OpenCV configuration
[target.aarch64-linux-android.env]
OPENCV_VERSION = "4.13.0"
OPENCV_INCLUDE_PATHS = { value = "opencv-android-sdk/sdk/native/jni/include", relative = true }
OPENCV_LINK_PATHS = { value = "opencv-android-sdk/sdk/native/staticlibs/arm64-v8a", relative = true }
OPENCV_LINK_LIBS = "opencv_gapi,opencv_stitching,opencv_calib3d,opencv_dnn,opencv_features2d,opencv_flann,opencv_highgui,opencv_imgcodecs,opencv_imgproc,opencv_ml,opencv_objdetect,opencv_photo,opencv_video,opencv_videoio,opencv_core"
OPENCV_DISABLE_PROBES = "pkg_config,cmake,vcpkg_cmake,vcpkg"

