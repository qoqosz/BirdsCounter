[target.aarch64-apple-ios]
rustflags = [
    "-L", "framework=src-tauri/opencv2.framework",
]

[target.aarch64-apple-ios-sim]
rustflags = [
    "-L", "framework=src-tauri/opencv2.framework",
]

[target.x86_64-apple-ios]
rustflags = [
    "-L", "framework=src-tauri/opencv2.framework",
]

[target.aarch64-apple-darwin.env]
# Prevent the iOS framework from being picked up via OPENCV_* env vars.
OPENCV_DISABLE_PROBES = "environment"
OPENCV_PKGCONFIG_NAME = "opencv5"

[target.x86_64-apple-darwin.env]
# Prevent the iOS framework from being picked up via OPENCV_* env vars.
OPENCV_DISABLE_PROBES = "environment"
OPENCV_PKGCONFIG_NAME = "opencv5"
