<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Birds Counter</title>
    <script type="module" src="/main.js" defer></script>
</head>

<body>
    <main class="container">
        <header class="app-header">
            <button id="backBtn" class="back-button" style="display: none;" aria-label="Go back">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <h1>Birds Counter</h1>
        </header>

        <div class="drag-drop-area" id="dragDropArea">
            <svg class="upload-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="17 8 12 3 7 8"></polyline>
                <line x1="12" y1="3" x2="12" y2="15"></line>
            </svg>
            <p class="drag-text">Drag and drop an image here</p>
            <p class="drag-subtext">or use the buttons below</p>
            <input type="file" id="imageInput" accept="image/*"
                style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;" />
            <input type="file" id="cameraInput" accept="image/*" capture="environment"
                style="position: absolute; width: 0; height: 0; opacity: 0; pointer-events: none;" />
        </div>

        <div class="button-container">
            <button id="cameraBtn" class="action-button camera-button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path>
                    <circle cx="12" cy="13" r="4"></circle>
                </svg>
                Use Camera
            </button>
            <button id="galleryBtn" class="action-button gallery-button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <circle cx="8.5" cy="8.5" r="1.5"></circle>
                    <polyline points="21 15 16 10 5 21"></polyline>
                </svg>
                Load from Gallery
            </button>
        </div>

        <div id="imagePreview" class="image-preview" style="display: none">
            <img id="previewImg" src="" alt="Preview" />
        </div>

        <button id="processBtn" class="action-button process-button" style="display: none; margin-top: 1rem;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <polyline points="23 4 23 10 17 10"></polyline>
                <polyline points="1 20 1 14 7 14"></polyline>
                <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
            </svg>
            Zlicz
        </button>
    </main>
</body>

</html>
