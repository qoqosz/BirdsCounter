# Builds the signed Android APK (arm64-v8a) and attaches it to a GitHub release.
# Runs when a release is published, or by hand for an existing release tag.
#
# Needs these repository secrets:
#   ANDROID_KEYSTORE_BASE64  the release keystore (.jks), base64-encoded
#   ANDROID_KEY_ALIAS        key alias in the keystore
#   ANDROID_STORE_PASSWORD   keystore password
#   ANDROID_KEY_PASSWORD     key password
name: Android APK

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build and attach the APK to (e.g. v0.6.2)
        required: true

permissions:
  contents: write

concurrency:
  group: android-apk-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
      # Same NDK as local builds
      NDK_VERSION: 28.2.13676358
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Android NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;$NDK_VERSION" > /dev/null
          echo "NDK_HOME=$ANDROID_HOME/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      # libclang for the opencv crate's binding generator
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev

      - name: Cache OpenCV Android SDK
        id: opencv-cache
        uses: actions/cache@v4
        with:
          path: src-tauri/opencv-android-sdk
          key: opencv-android-${{ hashFiles('setup_opencv_android.sh') }}

      - name: Download OpenCV Android SDK
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        run: ./setup_opencv_android.sh

      # Installs the toolchain and components pinned in rust-toolchain.toml.
      - name: Set up Rust
        run: |
          rustup toolchain install
          rustup target add aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          cache-all-crates: true

      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2.12" --locked

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set"
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: Build APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./build_android.sh --target aarch64

      - name: Verify signature
        run: |
          apk=src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$apksigner" verify --print-certs "$apk" | grep -E "Signer #1 certificate (DN|SHA-256)"

      - name: Attach APK to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          asset="BirdsCounter_${version}_android_arm64.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk "$asset"
          gh release upload "$TAG" "$asset" --clobber
